<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodday - ระบบห้องสมุด</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="antialiased">

  <div class="max-w-md mx-auto min-h-screen bg-gradient-to-br from-purple-500 to-violet-600 flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">

    <div class="absolute top-10 left-6 text-white/10 text-8xl"><i class="fa-solid fa-book"></i></div>
    <div class="absolute bottom-16 right-6 text-white/10 text-9xl"><i class="fa-solid fa-book-open-reader"></i></div>

    <div class="relative z-10 flex flex-col items-center">
      <div class="w-28 h-28 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center text-5xl text-white mb-6 shadow-lg">
        <i class="fa-solid fa-screwdriver-wrench"></i>
      </div>

      <span class="bg-white/20 text-white text-sm font-black uppercase tracking-widest px-4 py-1.5 rounded-full mb-4 backdrop-blur-sm">
        Coming Soon
      </span>

      <h2 class="text-3xl font-black text-white mb-3 leading-tight">ระบบห้องสมุด<br>กำลังปิดปรับปรุง</h2>

      <p class="text-purple-100 text-lg leading-relaxed max-w-xs mb-8">
        เรากำลังพัฒนาระบบห้องสมุดให้ใช้งานง่ายและดียิ่งขึ้น<br>ขออภัยในความไม่สะดวก 🙏
      </p>

      <button id="btn-close-liff" class="bg-white text-purple-600 px-8 py-4 rounded-2xl font-black text-lg shadow-lg">
        ปิดหน้าต่างนี้
      </button>
    </div>
  </div>

  <script>
    const LIFF_ID = '2009970638-GrD1aOi9'; // 🔴 แก้ทีหลังตอนสมัคร LIFF เสร็จ

    liff.init({ liffId: LIFF_ID }).then(() => {
      document.getElementById('btn-close-liff').onclick = () => {
        if (liff.isInClient()) {
          liff.closeWindow(); // ปิดหน้าต่างกลับไป LINE เลย (ถ้าเปิดจากในแอป LINE)
        } else {
          window.close();
        }
      };
    }).catch(() => {
      // เปิดนอกแอป LINE ก็ยังใช้งานได้ปกติ แค่ปุ่มปิดจะไม่มีผล
      document.getElementById('btn-close-liff').onclick = () => window.close();
    });
  </script>
</body>
</html>
